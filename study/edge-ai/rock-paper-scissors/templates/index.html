<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RPS · 김민준</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Malgun Gothic",sans-serif;background:#101010;color:#f3f3f3}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;padding:28px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:21px;letter-spacing:4px;margin:0}.connection{font-size:12px;color:#999}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}.camera{position:relative;aspect-ratio:4/3;background:#080808;border:1px solid #333;border-radius:12px;overflow:hidden}.camera img{width:100%;height:100%;object-fit:contain}.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}#count{background:#101010cc;border:1px solid #777;border-radius:18px;min-width:140px;padding:16px;text-align:center;font-size:86px;font-weight:800;line-height:1.2}#count.small{font-size:30px}[hidden]{display:none!important}.caption{position:absolute;bottom:12px;left:12px;color:#eee;background:#111a;padding:5px 9px;border-radius:4px;font-size:11px}.hands{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.hand{border:1px solid #333;border-radius:10px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}.hand span{color:#a0a0a0;font-size:13px}.hand strong{font-size:22px;font-weight:650}.panel{border:1px solid #333;border-radius:12px;padding:24px;height:100%;display:flex;flex-direction:column}.small-label{font-size:12px;color:#999}.score{display:flex;justify-content:space-between;align-items:center;margin:18px 0 7px;font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}.score i{font-size:20px;color:#666;font-style:normal}.labels{display:flex;justify-content:space-between;font-size:12px;color:#999}.draw{text-align:center;color:#888;font-size:12px;margin:18px 0 0}.divider{height:1px;background:#333;margin:24px 0}.result{font-size:23px;font-weight:650;line-height:1.45;margin:0 0 12px}.detail{font-size:13px;color:#aaa;line-height:1.7;min-height:44px}.controls{margin-top:auto;padding-top:22px}button{font:inherit;cursor:pointer;border:1px solid #eee;background:#eee;color:#111;border-radius:8px;width:100%;padding:13px;font-size:14px;font-weight:700}button:disabled{opacity:.35;cursor:default}.reset{margin-top:9px;color:#aaa;border-color:#383838;background:transparent;font-size:12px;font-weight:400}kbd{font:inherit;border:1px solid currentColor;border-radius:4px;padding:1px 5px;margin-left:8px;font-size:11px}.hint{font-size:12px;color:#999;margin:14px 0 0;min-height:20px}.error{font-size:13px;color:#fff;margin-top:12px}.footer{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:24px;font-size:11px;color:#777}.settings{display:flex;gap:8px;align-items:center}select{background:#1b1b1b;color:#ddd;border:1px solid #444;border-radius:5px;padding:5px;font:inherit}button:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:4px}@media(max-width:800px){main{padding:18px}.layout{grid-template-columns:1fr}.panel{padding:20px}.score{max-width:240px;width:100%;margin:10px auto}.labels{max-width:240px;width:100%;margin:auto}.divider{margin:16px 0}.controls{padding-top:12px}.footer{flex-wrap:wrap}.hand strong{font-size:19px}}
</style></head><body><main>
<header><h1>RPS</h1><span id="connection" class="connection">카메라 연결 중</span></header>
<div class="layout"><section><div class="camera"><img src="/video" alt="실시간 손 인식 영상"><div class="overlay"><div id="count" hidden></div></div><span class="caption">실시간 · 거울 화면</span></div><div class="hands"><div class="hand"><span>내 왼손</span><strong id="left-gesture">—</strong></div><div class="hand"><span>내 오른손</span><strong id="right-gesture">—</strong></div></div><p id="hint" class="hint">양손이 화면 안에 들어오게 해주세요.</p><p id="error" class="error" role="alert"></p></section>
<aside class="panel"><span class="small-label">점수</span><div class="score"><span id="left-score">0</span><i>:</i><span id="right-score">0</span></div><div class="labels"><span>내 왼손</span><span>내 오른손</span></div><p class="draw">무승부 <span id="draw-score">0</span>회</p><div class="divider"></div><p id="result" class="result" aria-live="polite">준비하세요</p><div id="detail" class="detail">시작키를 누르면<br>3초 뒤 판정합니다.</div><div class="controls"><button id="start" disabled><span id="start-label">게임 시작</span><kbd id="key-badge">Space</kbd></button><button id="reset" class="reset">점수 초기화 <kbd>R</kbd></button></div></aside></div>
<footer class="footer"><span>김민준 · RPS / V6</span><label class="settings">시작키 <select id="start-key" aria-label="게임 시작키"><option value="Space">스페이스바</option><option value="Enter">Enter</option><option value="KeyS">S</option></select></label><span>게임 화면에서 키를 누르세요.</span></footer>
</main><script>
const $=id=>document.getElementById(id),names={rock:'바위',paper:'보',scissors:'가위'},keyNames={Space:'Space',Enter:'Enter',KeyS:'S'};
let pending=false,state=null,startKey='Space',actionError='';
try{const saved=localStorage.getItem('rps-start-key');if(saved in keyNames)startKey=saved}catch(e){}
$('start-key').value=startKey;$('key-badge').textContent=keyNames[startKey];
$('start-key').onchange=()=>{startKey=$('start-key').value;$('key-badge').textContent=keyNames[startKey];try{localStorage.setItem('rps-start-key',startKey)}catch(e){}};
function running(){return state&&['countdown','judging'].includes(state.phase)}
function updateButtons(){$('start').disabled=pending||!state?.camera||running()||state?.calibration?.active;$('reset').disabled=pending}
async function action(name){if(pending||(name==='start'&&$('start').disabled))return;pending=true;updateButtons();try{const r=await fetch('/api/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(5000)});const d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');actionError='';if(name==='start'&&state)state.phase='countdown';}catch(e){actionError=e.name==='TimeoutError'?'응답이 늦습니다. 화면 상태를 확인해주세요.':e.message}finally{pending=false;updateButtons();$('error').textContent=actionError}}
$('start').onclick=()=>action('start');$('reset').onclick=()=>action('reset');
document.addEventListener('keydown',e=>{if(e.repeat||e.isComposing||e.ctrlKey||e.altKey||e.metaKey||e.shiftKey)return;const t=e.target;if(t?.closest('input,textarea,select,button,a,[contenteditable="true"]'))return;if(e.code===startKey){e.preventDefault();action('start')}else if(e.code==='KeyR'){e.preventDefault();action('reset')}});
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error('상태 조회 실패');state=await r.json();const s=state;const active=running();$('connection').textContent=s.camera?'카메라 연결됨':'카메라 확인 필요';for(const side of ['left','right']){$(side+'-gesture').textContent=names[s.hands[side]?.gesture]||(s.hands[side]?'확인 중':'—');$(side+'-score').textContent=s.score[side]}$('draw-score').textContent=s.score.draw;$('count').hidden=!active;$('count').textContent=s.phase==='countdown'?s.countdown:'판정 중';$('count').classList.toggle('small',s.phase==='judging');$('start-label').textContent=active?'진행 중':s.phase==='ready'?'게임 시작':'다음 라운드';
if(s.result){$('result').textContent={left:'왼손 승리',right:'오른손 승리',draw:'무승부'}[s.result.winner];$('detail').textContent='이번 결과 · 왼손 '+names[s.result.left]+' / 오른손 '+names[s.result.right]}else{$('result').textContent={ready:'준비하세요',countdown:'가위, 바위, 보',judging:'동작을 유지하세요',retry:'다시 해볼까요?'}[s.phase]||'준비하세요';$('detail').textContent=s.phase==='retry'?'양손 동작을 확인하지 못했습니다. 시작키를 눌러 다시 시도하세요.':active?'양손이 안정적으로 인식되면 결과가 확정됩니다.':'시작키를 누르면 3초 뒤 판정합니다.'}
$('hint').textContent=s.diagnostic||'양손이 화면 안에 들어오게 해주세요.';$('error').textContent=s.error||actionError;updateButtons();
}catch(e){state=null;$('connection').textContent='서버 연결 끊김';$('count').hidden=true;$('left-gesture').textContent='—';$('right-gesture').textContent='—';$('error').textContent='라즈베리파이 서버와 네트워크를 확인해주세요.';updateButtons()}finally{setTimeout(poll,180)}}poll();
</script></body></html>
